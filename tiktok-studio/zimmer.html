<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;padding:0;background:#000;overflow:hidden}#wrap{position:relative;width:1080px;height:1920px;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<div id="wrap"></div>
<script type="importmap">
{ "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }
</script>
<script type="module">
// Referenz "Jugendzimmer nachts": Du sitzt auf der Bettkante und schreibt (Folge 2 / 8)
import * as THREE from 'three';
import { spawnBlock } from './kit_block.js';
import { createStage } from './kit_look.js';
import { buildZimmer, ZANCHOR } from './set_zimmer.js';
import { loadHumanAssets, spawn, posePhone, sitOn, lookAt } from './kit_cast.js';
import { armIK } from './kit_human.js';

const stage = createStage({ preset: 'innen_nacht', shadowExtent: 8 });
const { scene, qn, Q } = stage;
async function main() {
  const Z = buildZimmer(stage, {}); const shot = Q.get('shot') || 'bett';
  let focus = new THREE.Vector3(-0.6, 1.1, -0.35);
  if (!Q.has('nochar')) {
    await loadHumanAssets();
    let du;
    if (shot === 'bett') {
      du = spawnBlock('du', { anim: 'Sitting_Idle_Loop', time: qn('st', 0.8), x: 0, y: 0, z: 0, ry: qn('hry', 1.19) }); scene.add(du);
      sitOn(du, new THREE.Vector3(qn('sx', ZANCHOR.bedSide.x), qn('sy', ZANCHOR.bedSide.y), qn('sz', ZANCHOR.bedSide.z)));
      posePhone(du, { forward: qn('pf', 0.28), height: qn('ph', -0.06), neck: 0.2, head: 0.3, light: 0.03 }); du.userData.blockFace.set(Q.get('expr') || 'sad', { look: [0, 0.7] });
    } else {
      Z.chair.rotation.y = Math.PI / 2; Z.chair.position.set(1.15, 0, 0.42); Z.chair.updateMatrixWorld(true);
      du = spawnBlock('du', { anim: 'Sitting_Idle_Loop', time: 0.8, x: 0, y: 0, z: 0, ry: Math.PI / 2 }); scene.add(du);
      sitOn(du, ZANCHOR.chairSeat);
      const down = new THREE.Vector3(0, -1, 0);
      armIK(du, 'l', ZANCHOR.keyboard.clone().add(new THREE.Vector3(-0.05, 0.03, 0.02)), down.clone().add(new THREE.Vector3(-0.2, 0, -0.6)));
      armIK(du, 'r', ZANCHOR.mouse.clone().add(new THREE.Vector3(-0.06, 0.03, 0)), down.clone().add(new THREE.Vector3(-0.2, 0, 0.6)));
      lookAt(du, ZANCHOR.monitor, 0.8); du.userData.blockFace.set(Q.get('expr') || 'neutral');
    }
    focus = du.userData.bones.Head.getWorldPosition(new THREE.Vector3());
  }
  if (shot === 'bett') stage.view({ pos: [2.0, 1.95, 3.7], target: [-1.0, 0.72, -0.8], fov: 58 });
  else stage.view({ pos: [-1.65, 1.85, 3.7], target: [1.25, 0.9, -0.3], fov: 56 });
  stage.build({ focus, aperture: 0.0006 }).ready();
}
main().catch(e => console.error('BUILD ERROR', e.message, e.stack));
</script>
</body>
</html>
