<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;padding:0;background:#000;overflow:hidden}#wrap{position:relative;width:1080px;height:1920px;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<div id="wrap"></div>
<script type="importmap">
{ "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }
</script>
<script type="module">
// Testclip (ca. 10 s): Du läuft den Lindenweg entlang zur Party, bleibt am Tor stehen, die Stimmung kippt, dann holt er das Handy hoch.
import * as THREE from 'three';
import { createStage } from './kit_look.js';
import { buildStrasse, SW } from './set_strasse.js';
import { loadHumanAssets, holdCup } from './kit_cast.js';
import { spawnBlock, loadBlockMoves, povHide, povPose, povPhoneRig, partyStoryTex } from './kit_block.js';
import { Actor, clipSpeed, smooth, blinkAt } from './kit_anim.js';
import { createHUD, counterAt } from './kit_hud.js';

// VORLAGE FÜR JEDE FOLGE – Ego-Perspektive (wir sehen alles mit den Augen von „Du“), Klötzchen-Figuren:
// Du läuft zur Party (ruhige Kamera auf Augenhöhe), bleibt am Tor stehen und schaut zu den Gästen, die Stimmung kippt
// (Zähler fällt, Gesichter reagieren), dann holt er das Handy hoch: hochkant vor dir, deine Hände halten es (wie in Spielen), Leons Story auf dem Bildschirm.
const stage = createStage({ preset: 'nacht' });
const { scene } = stage;
async function main() {
  const S = await buildStrasse(stage, { party: true });
  await loadHumanAssets(); await loadBlockMoves();
  const du = spawnBlock('du', { anim: 'Walk_Loop', x: 5.0, y: SW, z: -2.6, ry: 0 }); scene.add(du); povHide(du); // Kopf ausblenden: Kamera sitzt in den Augen
  const phone = povPhoneRig(stage, du, { screen: partyStoryTex() }); // Handy vor der Kamera
  const v = clipSpeed(du, 'Walk_Loop'); console.log('walk speed', v.toFixed(3));
  const WS = 1.2; const z0 = -2.6, z1 = 3.15, tWalk = (z1 - z0) / (v * WS); const tStop = tWalk; console.log('stop at', tStop.toFixed(2));
  const tShame = tStop + 1.4, tPhone = tShame + 1.0, END = tPhone + 2.0;
  const actors = [
    new Actor(du, { segs: [{ anim: 'Walk_Loop', at: 0, speed: WS }, { anim: 'Idle_Loop', at: tStop - 0.15, fade: 0.5 }],
      path: [[0, 5.0, z0], [tWalk, 5.05, z1]], ry: [[0, 0], [tStop - 0.1, 0], [tStop + 0.9, 1.35]] }),
    new Actor(spawnBlock('jasmin', { x: 9.3, y: SW, z: -1.0, ry: -1.0 }), { segs: [{ anim: 'Dance_Loop', at: 0, offset: 1.3 }, { anim: 'Idle_Loop', at: tShame, fade: 0.5 }] }),
    new Actor(spawnBlock('leon', { x: 10.0, y: SW, z: 2.0, ry: -2.4 }), { segs: [{ anim: 'Idle_Talking_Loop', at: 0, offset: 2.0 }] }),
    new Actor(spawnBlock('mia', { x: 10.55, y: SW, z: 1.15, ry: -0.75 }), { segs: [{ anim: 'Idle_Loop', at: 0, offset: 0.7 }] }),
    new Actor(spawnBlock('tarik', { x: 11.75, y: SW + 0.45, z: 0.55, ry: -1.57 }), { segs: [{ anim: 'Dance_Loop', at: 0, offset: 0.4 }, { anim: 'Idle_FoldArms_Loop', at: tShame + 0.3, fade: 0.5 }] }),
  ];
  actors.slice(1).forEach(a => scene.add(a.h)); holdCup(actors[2].h, 'r');
  const guests = new THREE.Vector3(10.4, SW + 1.45, 0.8);
  const hud = await createHUD(); hud.loc('LINDENWEG · 22:47');
  stage.build({ focus: new THREE.Vector3(5, 1.6, 0) });
  // Gesichter der Gäste: vorher gute Laune, ab tShame reagieren sie auf „Du“
  const before = ['laugh', 'happy', 'happy', 'laugh'], after = ['laugh', 'sideeye', 'awkward', 'smirk'];
  window.renderFrame = (t) => {
    for (const a of actors) a.update(t);
    S.swayAt(t);
    du.userData.blockFace.set('neutral');
    actors.slice(1).forEach((a, i) => a.h.userData.blockFace.set(t > tShame + i * 0.15 ? after[i] : before[i], { blink: blinkAt(t, i + 2), talk: i === 1 && t < tShame ? Math.max(0, Math.sin(t * 9)) * 0.8 : 0 }));
    // Ego-Kamera: ruhig beim Gehen -> Blick zu den Gästen -> Kopf folgt beim Blick aufs Handy
    const st = povPose(du, { steady: true, pitch: -0.06, bob: t < tStop ? 0.012 : 0, t });
    const kLook = smooth((t - tStop + 0.4) / 1.2); st.dir.lerp(guests.clone().sub(st.eye).normalize(), kLook).normalize();
    const kPh = smooth((t - tPhone) / 0.55); phone.set(kPh); // Handy hochholen
    st.dir.y -= 0.1 * kPh; st.dir.normalize(); // dabei leicht nach unten schauen
    const cam = stage.camera; cam.position.copy(st.eye); cam.lookAt(st.eye.clone().add(st.dir)); cam.fov = 60; cam.near = 0.03; cam.updateProjectionMatrix();
    stage.setFocus(kPh > 0.5 ? st.eye.clone().addScaledVector(st.dir, 0.34) : guests);
    const c = counterAt(t, [[0, 100], [tShame, 85], [tPhone + 0.8, 72]]); hud.counter(c.v, c.fl);
    const so = Math.min(smooth((t - 3.9) / 0.3), 1 - smooth((t - 6.4) / 0.3)); hud.sub('Vielleicht haben sie’s vergessen.', so);
    hud.hud(smooth(t / 0.4));
    stage.render();
  };
  window.renderStill = () => { window.renderFrame(parseFloat(new URLSearchParams(location.search).get('t') || '3')); return true; };
  window.clipLength = END; window.ready = true;
}
main().catch(e => console.error('BUILD ERROR', e.message, e.stack));
</script>
</body>
</html>
