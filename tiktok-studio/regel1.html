  $('title').style.top = t < 10 ? '470px' : '560px';
  $('question').textContent = 'Wärst du trotzdem hingegangen?'; $('question').style.opacity = seg(t, 37.8, 38.5);
  // subtitles
  let s = '', so = 0;
  for (const [a, b, txt] of subs) if (t >= a && t < b) { s = txt; so = Math.min(seg(t, a, a + 0.2), 1 - seg(t, b - 0.2, b)); }
  $('sub').textContent = s; $('sub').style.opacity = so; $('band').style.opacity = so > 0 ? 0.9 * so : 0;
  // hud
  const loc = t < 7 ? 'STRASSE · 22:47' : t < 13 ? 'HAUSTÜR · 22:51' : 'PARTY · 22:52';
  $('loc').textContent = loc;
  const hudOp = (t < 4 ? seg(t, 3.6, 4.2) : 1) * (1 - seg(t, 35.9, 36.4));
  $('hud').style.opacity = hudOp;
  const c = counterAt(t);
  $('num').textContent = c.v + ' %';
  $('num').style.color = c.flash > 0.05 ? `rgb(255,${255 - 190 * c.flash | 0},${255 - 190 * c.flash | 0})` : '#fff';
  $('num').style.transform = `scale(${1 + 0.12 * c.flash})`;
  $('flash').style.opacity = c.flash * 0.8;
  $('dark').style.opacity = 0.5 * seg(t, 36.2, 36.9);
  // colour grade: the world loses colour with self-respect
  const sat = t < 17 ? 1.05 : t < 22 ? lerp(1.05, 0.72, seg(t, 17, 22)) : t < 27 ? lerp(0.72, 0.5, seg(t, 22, 27)) : t < 32 ? lerp(0.5, 0.28, seg(t, 27, 32)) : lerp(0.28, 0.12, seg(t, 32, 35));
  const bri = t < 27 ? 1 : lerp(1, 0.88, seg(t, 27, 35));
  canvasEl.style.filter = `saturate(${sat.toFixed(3)}) brightness(${bri.toFixed(3)})`;
  return c;
}

// ================= shot logic =================
let shakeAmt = 0;
function shake(t, at, dur, amp) { if (t >= at && t < at + dur) { const k = 1 - seg(t, at, at + dur); shakeAmt = Math.max(shakeAmt, amp * k); } }

window.renderFrame = (t) => {
  shakeAmt = 0;
  const c = overlay(t);
  for (const [kt] of counterKeys.slice(1)) shake(t, kt, 0.35, 0.025);
  shake(t, 11.0, 0.4, 0.06);
  handGroup.visible = false; phoneGroup.visible = false; camFill.intensity = 0;
  let scene = street;

  if (t < 7.0) {
    // ---------- S1/S2 street ----------
    scene = street;
    const U = street.userData;
    const walkSpeedZ = t < 4 ? -1.35 : 0;
    let z = t < 4 ? 4 - 1.35 * t : (4 - 1.35 * 4) + 2.4 * (t - 4) - 1.0 * ss(t, 4, 4.6) * 0.6;
    const bobF = t < 4 ? 1.8 : 2.3;
    const bob = Math.sin(t * 2 * Math.PI * bobF) * 0.045, sway = Math.sin(t * Math.PI * bobF) * 0.03;
    let x = lerp(4.3, 3.4, ss(t, 4.2, 7));
    // phone lowers the gaze a bit while reading
    const read = ss(t, 0.7, 1.2) * (1 - ss(t, 3.7, 4.2));
    let yaw = Math.sin(t * 0.6) * 0.05;
    const yawHouse = yawTo(x, z, -6.5, 20);
    yaw = lerpAngle(yaw, yawHouse, ss(t, 4.0, 5.1));
    const pitch = -0.08 * read + (t > 4 ? 0.03 : 0);
    setCam(x + sway, 1.72 + bob, z, yaw + sway * 0.3, pitch, Math.sin(t * Math.PI * bobF) * 0.008);
    // phone in hand
    if (read > 0.01) {
      phoneGroup.visible = true;
      phoneGroup.position.set(0.035 + sway * 0.2, lerp(-0.32, -0.085, read) + bob * 0.3, -0.3);
      phoneGroup.rotation.set(0.12, -0.08, 0.04);
      drawStory(t);
      // vibration jiggle
      if (t > 0.85 && t < 1.15) phoneGroup.position.x += Math.sin(t * 160) * 0.003;
    }
    U.mover.position.z = -40 + t * 9;
    U.pl.intensity = 60 + 40 * Math.max(0, Math.sin(t * 7.5)); U.pl2.intensity = 40 + 30 * Math.max(0, Math.cos(t * 6.1));
    U.partyWin.emissiveIntensity = 0.7 + 0.8 * Math.max(0, Math.sin(t * 7.5));
    U.lamps.forEach((L, i) => L.intensity = 20 + (i === 5 ? (Math.sin(t * 37) > 0.6 ? -14 : 0) : 0));
    U.outside.forEach((p, i) => p.idle(t, i));
  } else if (t < 13.0) {
    // ---------- S3/S4 front door ----------
    scene = door;
    const U = door.userData, leon = U.leon;
    let x = lerp(3.0, 1.75, ss(t, 7.0, 7.6));
    const push = ss(t, 10.2, 12.7);
    x = lerp(x, -2.6, push);
    let zc = lerp(0.12, 0.25, push);
    const bob = Math.sin(t * 2 * Math.PI * 1.6) * 0.03 * (t < 7.6 || t > 10.2 ? 1 : 0.2);
    let yaw = Math.PI / 2 + Math.sin(t * 0.8) * 0.02;
    if (t >= 7.1 && t < 7.8) yaw += 0.18 * Math.sin(Math.PI * seg(t, 7.1, 7.8)); // glance at bell
    if (t > 10.9 && t < 11.4) yaw += Math.sin((t - 10.9) * 30) * 0.03; // bump
    setCam(x, 1.72 + bob, zc, yaw, -0.02, (t > 10.95 && t < 11.3) ? 0.05 * Math.sin((t - 10.95) * 20) : 0);
    // hand presses bell
    const reach = Math.sin(Math.PI * seg(t, 7.15, 7.75));
    if (reach > 0.01) { handGroup.visible = true; handGroup.position.set(lerp(0.16, -0.03, reach), -0.24 + reach * 0.1, -0.28 - reach * 0.1); handGroup.rotation.set(0.15, 0.55, 0); }
    U.bell.material.emissiveIntensity = (t > 7.4 && t < 7.7) ? 3 : 1.2;
    // door opens
    U.hinge.rotation.y = -1.75 * ss(t, 8.1, 8.6);
    // leon
    leon.rest();
    leon.g.position.x = -0.8; leon.g.position.z = lerp(0.15, 0.6, ss(t, 10.5, 11.3));
    leon.face(x, zc, 1);
    if (t < 8.7) { leon.expr('laugh'); leon.head.rotation.y = -0.5 * (1 - ss(t, 8.4, 8.75)); }
    else if (t < 10.4) { leon.expr('awkward'); }
    else { leon.expr('annoyed'); leon.armL.rotation.x = -0.25; }
    if (t > 11.0 && t < 11.5) leon.g.position.z -= Math.sin((t - 11) * 6) * 0.08;
    U.hl1.intensity = 22 + 12 * Math.max(0, Math.sin(t * 7.5)); U.hl2.intensity = 16 + 10 * Math.max(0, Math.cos(t * 6.1));
    U.pw.emissiveIntensity = 0.7 + 0.8 * Math.max(0, Math.sin(t * 7.5));
    U.back.forEach((p, i) => p.dance(t, 1, i));
  } else {
    // ---------- S5..S10 party ----------
    scene = party;
    const mood = t < 17 ? 1 : t < 22 ? lerp(1, 0.6, seg(t, 17, 22)) : t < 27 ? lerp(0.6, 0.35, seg(t, 22, 27)) : t < 33.5 ? lerp(0.35, 0.15, seg(t, 27, 33.5)) : 0;
    // lights
    const lt = t * (0.6 + mood * 1.4);
    P.l1.position.set(1.5 + Math.sin(lt * 1.3) * 4, 2.6, -0.5 + Math.cos(lt * 1.1) * 3);
    P.l2.position.set(1.5 + Math.cos(lt * 0.9) * 4.5, 2.6, -0.5 + Math.sin(lt * 1.4) * 3);
    P.l3.position.set(1.5 + Math.sin(lt * 1.7 + 2) * 3, 2.4, -0.5 + Math.cos(lt * 0.7 + 1) * 3.5);
    const musicOn = t < 33.55;

    P.l2.intensity = musicOn ? 20 + 30 * mood * (0.5 + 0.5 * Math.max(0, Math.cos(t * 11))) : 4;
    P.l3.intensity = musicOn ? 10 + 25 * mood : 2;
    P.led.emissiveIntensity = musicOn ? 0.5 + 2 * Math.abs(Math.sin(t * 13)) : 0;
    P.button.material.emissiveIntensity = musicOn ? 1.5 : 0.2;
    P.bulbs.forEach((m, i) => m.emissiveIntensity = musicOn ? 0.6 + 1.2 * mood * (Math.sin(t * 5 + i) > 0 ? 1 : 0.3) : 0.3);
    P.ball.rotation.y = t < 27 ? t * 1.1 : 27 * 1.1 + (t - 27) * (musicOn ? 0.45 : 0.25);
    P.ball.material.emissive.setScalar(musicOn ? 0.2 * mood : 0.02);

    // camera path
    let cx, cz, yaw, pitch = 0, roll = 0, walking = false;
    if (t < 17) { // S5 enter
      const k = ss(t, 13, 16);
      cx = lerp(-7.8, -5.0, k); cz = lerp(4.1, 3.0, k); walking = t < 16;
      yaw = lerp(-Math.PI / 2 + 0.05, -1.05, ss(t, 13.5, 16.5)) + Math.sin(t * 0.9) * 0.05;
    } else if (t < 22) { // S6 scan
      cx = lerp(-5.0, -4.3, ss(t, 17, 22)); cz = lerp(3.0, 2.3, ss(t, 17, 22));
      yaw = lerp(-1.05, -1.75, ss(t, 17, 21.5)) + Math.sin(t * 1.3) * 0.03;
    } else if (t < 24.6) { // S7 walk to snack table
      const k = ss(t, 22, 24.4);
      cx = lerp(-4.3, -4.9, k); cz = lerp(2.3, -1.6, k); walking = t < 24.2;
      yaw = lerpAngle(-1.75, yawTo(-4.9, -1.6, -5.4, -4.9), ss(t, 22, 23.2));
      pitch = -0.08 * ss(t, 23.5, 24.5);
    } else if (t < 27) { // S7b over-the-shoulder phone
      cx = -2.28; cz = -3.42; const dolly = ss(t, 24.6, 27) * 0.1; cz -= dolly; cx -= dolly * 0.2;
      yaw = yawTo(cx, cz, -2.62, -4.62); pitch = Math.atan2(1.22 - 2.2, Math.hypot(-2.62 - cx, -4.62 - cz));
    } else if (t < 32) { // S8 wide + whisper turn
      cx = lerp(-6.2, -6.0, seg(t, 27, 32)); cz = lerp(4.4, 4.0, seg(t, 27, 32));
      const base = yawTo(cx, cz, 3.0, -2.0);
      const turn = ss(t, 28.4, 28.95) * (1 - ss(t, 30.0, 30.6));
      yaw = lerpAngle(base, yawTo(cx, cz, -3.2, 5.55) , turn); pitch = -0.03 * turn;
    } else { // S9/S10 low point + ending
      cx = 2.2; cz = -0.6;
      const leonPos = P.leon.g.position;
      const yawL = yawTo(cx, cz, leonPos.x, leonPos.z);
      yaw = yawL; pitch = -0.02;
      if (t > 36) { const k = ss(t, 36, 42) * 0.25; cx = lerp(cx, leonPos.x, k * 0.3); cz = lerp(cz, leonPos.z, k * 0.3); }
    }
    const bob = walking ? Math.sin(t * 2 * Math.PI * 1.8) * 0.045 : Math.sin(t * 1.7) * 0.008;
    setCam(cx, (t >= 24.6 && t < 27 ? 2.2 : 1.72) + bob, cz, yaw, pitch, roll + (t > 27 && t < 32 ? -0.03 * ss(t, 30, 31) : 0) + (t > 32 ? -0.02 : 0));

    // crowd behaviour
    P.crowd.forEach((p, i) => {
      p.rest();
      const [hx, hz] = p.home;
      // notice times: first person at 15.8, others between 17.2 and 21.4
      const nt = i === 7 ? 15.8 : 17.2 + ((i * 0.37) % 1) * 4.2;
      // leave times
      const lv = 27.0 + ((i * 0.61) % 1) * 2.6;
      if (t < nt) { p.dance(t, 1, p.style); p.g.rotation.y = p.ry0 + Math.sin(t * 0.8 + i) * 0.3; p.expr(i % 2 ? 'laugh' : 'smile'); p.g.position.set(hx, p.g.position.y, hz); }
      else if (t < lv) {
        const k = ss(t, nt, nt + 0.5);
        p.dance(t, 1 - k, p.style);
        p.g.position.set(hx, p.g.position.y, hz);
        const camX = camera.position.x, camZ = camera.position.z;
        const target = Math.atan2(camX - hx, camZ - hz);
        p.g.rotation.y = lerpAngle(p.ry0 + Math.sin(nt * 0.8 + i) * 0.3, target, k);
        p.expr(t < 22 ? 'stare' : (i % 3 ? 'annoyed' : 'stare'));
        if (t > 22) p.head.rotation.y = Math.sin(t * 0.6 + i) * 0.1;
        // whispering pairs
        if (t > 22 && t < 27 && i % 4 === 0) { p.head.rotation.z = 0.15; }
      } else {
        // walk to kitchen doorway (8.1, -3.0) then vanish
        const d = Math.hypot(8.6 - hx, -3.0 - hz), dur = d / 2.5;
        const k = clamp((t - lv) / dur);
        const px = lerp(hx, 8.8, k), pz = lerp(hz, -3.0, k);
        p.g.position.set(px, 0, pz); p.g.rotation.y = Math.atan2(8.8 - hx, -3.0 - hz);
        p.walk(t, 1); p.expr('neutral');
        p.g.visible = k < 0.999;
      }
    });
    // snack group disperses at 23.0
    P.snack.forEach((p, i) => {
      p.rest();
      const dirs = [[-7.2, 1.5], [-1.5, -5.4], [-6.8, -1.2]];
      const start = [[-5.9, -3.9], [-4.7, -3.7], [-5.3, -3.0]][i];
      if (t < 23.0) { p.idle(t, i); p.expr(i === 1 ? 'smile' : 'laugh'); p.g.position.set(start[0], 0, start[1]); p.armR.rotation.x = -0.5; }
      else if (t < 31) {
        const k = ss(t, 23.0 + i * 0.25, 25.5 + i * 0.25);
        p.g.position.set(lerp(start[0], dirs[i][0], k), 0, lerp(start[1], dirs[i][1], k));
        if (k < 0.98 && k > 0.02) { p.walk(t, 1); p.g.rotation.y = Math.atan2(dirs[i][0] - start[0], dirs[i][1] - start[1]); }

      } else p.g.visible = false;
    });
    // phone guy
    { const p = P.phoneGuy; p.rest(); p.g.position.set(-2.9, 0, -3.9); p.g.rotation.y = Math.PI; p.expr('smile');
      p.armR.rotation.x = -1.35; p.armL.rotation.x = -1.35; p.armR.rotation.z = 0.35; p.armL.rotation.z = -0.35; p.head.rotation.x = 0.35;
      chatPhone.visible = t < 29; p.g.visible = t < 29.5;
      drawChat(ss(t, 25.2, 26.8) * 160);
    }
    // whisperers
    P.whisper.forEach((p, i) => { p.rest(); p.g.visible = t > 27 && t < 32;
      const away = ss(t, 29.0, 29.5);
      const toward = i === 0 ? 1.3 : -1.6; p.g.rotation.y = lerp(toward, i === 0 ? 2.6 : 2.9, away);
      p.head.rotation.z = (1 - away) * (i === 0 ? 0.22 : -0.22); p.head.rotation.y = (1 - away) * (i === 0 ? 0.3 : -0.3);
      if (t < 29.0) p.head.rotation.y += (i === 0 ? -0.6 : 0.5) * Math.sin(Math.PI * seg(t, 28.2, 28.9)); });
    P.couchLight.intensity = (t > 27 && t < 32) ? 5 : 0;
    camFill.intensity = 2.5 + 3 * mood;
    // leon
    { const p = P.leon; p.rest();
      if (t < 32) { p.g.position.set(5.6, 0, -4.4); p.idle(t, 3); p.face(camera.position.x, camera.position.z, t > 18 ? 1 : 0.2); p.expr(t < 18 ? 'laugh' : 'annoyed'); }
      else if (t < 34.6) { // goes to the button
        const k = ss(t, 32, 33.2); p.g.position.set(lerp(5.6, 6.2, k), 0, lerp(-4.4, -4.7, k)); p.g.rotation.y = lerpAngle(p.g.rotation.y, Math.PI, 0.3);
        if (t < 33.2) p.walk(t, 1);
        if (t > 33.2) p.armR.rotation.x = -1.1 * Math.sin(Math.PI * seg(t, 33.2, 33.9));
        p.expr('annoyed');
      } else { // walks to stand in front of you
        const k = ss(t, 34.6, 36.3);
        p.g.position.set(lerp(6.2, 4.22, k), 0, lerp(-4.7, -2.68, k));
        if (k < 0.97) { p.walk(t, 0.8); p.g.rotation.y = Math.atan2(4.22 - 6.2, -2.68 + 4.7); }
        else { p.face(camera.position.x, camera.position.z, 1); p.armL.rotation.z = -0.05; p.armR.rotation.z = 0.05; }
        p.expr('awkward');
      }
    }
  }
  // shake
  if (shakeAmt > 0) { camera.position.x += (Math.random() - .5) * shakeAmt; camera.position.y += (Math.random() - .5) * shakeAmt; camera.rotation.z += (Math.random() - .5) * shakeAmt * 0.6; }
  if (camera.parent !== scene) scene.add(camera);
  const fov = (t >= 24.6 && t < 27) ? 14 : 68; if (camera.fov !== fov) { camera.fov = fov; camera.updateProjectionMatrix(); }
  rp.scene = scene;
  composer.render();
  return true;
};
