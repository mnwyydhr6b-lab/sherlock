<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;padding:0;background:#000;overflow:hidden}#wrap{position:relative;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<div id="wrap"></div>
<script type="importmap">
{ "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }
</script>
<script type="module">
// Gesichts-Nahaufnahme zum Prüfen von Mimik, Mund und Zähnen.
// gesicht.html?who=mia&expr=laugh&ek=1&jaw=0.5&yaw=20&pitch=10&dist=0.55&fov=22
//   who   Figur aus kit_cast (du, mia, leon, ...)      expr/ek  Ausdruck + Stärke      jaw  Mundöffnung überschreiben
//   yaw   Kamera um den Kopf (Grad, + = von rechts)     pitch    Kamera höher (+) / tiefer (-)      dist/fov  Abstand, Bildwinkel
// Rendern: node still.js "gesicht.html?expr=laugh" out.png 1 1080 1080
import * as THREE from 'three';
import { createStage } from './kit_look.js';
import { cnv, tex, makeRng } from './kit_world.js';
import { loadHumanAssets, spawn, lookAt } from './kit_cast.js';

const stage = createStage({ preset: 'studio', shadowExtent: 3, W: innerWidth, H: innerHeight });
const { scene, Q, qn } = stage; stage.keyLight.intensity *= 0.25; if (stage.rimLight) stage.rimLight.intensity *= 0.3; stage.hemi.intensity *= 0.5;
{ const S = 1024, c = cnv(S, S), g = c.getContext('2d'); const r = makeRng(3);
  const bg = g.createRadialGradient(S * 0.6, S * 0.35, 50, S * 0.5, S * 0.5, S * 0.75); bg.addColorStop(0, '#1b1840'); bg.addColorStop(0.6, '#0b0c1e'); bg.addColorStop(1, '#040409'); g.fillStyle = bg; g.fillRect(0, 0, S, S);
  const cols = ['255,90,200', '255,200,110', '170,110,255', '255,140,170', '120,170,255'];
  for (let i = 0; i < 30; i++) { const x = S * r(), y = S * (0.05 + r() * 0.85), rad = 20 + r() * 80, col = cols[i % cols.length], a = 0.12 + r() * 0.3; const gr = g.createRadialGradient(x, y, 0, x, y, rad); gr.addColorStop(0, `rgba(${col},${a})`); gr.addColorStop(0.7, `rgba(${col},${a * 0.8})`); gr.addColorStop(1, `rgba(${col},0)`); g.fillStyle = gr; g.beginPath(); g.arc(x, y, rad, 0, 6.28); g.fill(); }
  const bd = new THREE.Mesh(new THREE.PlaneGeometry(6, 6), new THREE.MeshBasicMaterial({ map: tex(c), toneMapped: false, fog: false })); bd.position.set(0.2, 1.6, -3.2); scene.add(bd); }
const spot = (col, I, p, tgt, ang = 0.5, pen = 0.8, shadow = false) => { const s = new THREE.SpotLight(col, I, 8, ang, pen, 1.5); s.position.set(...p); s.target.position.set(...tgt); s.castShadow = shadow; if (shadow) { s.shadow.mapSize.set(1024, 1024); s.shadow.bias = -0.0002; } scene.add(s, s.target); return s; };

await loadHumanAssets();
const h = spawn(Q.get('who') || 'du', { anim: 'Idle_Loop', time: qn('t', 0.6), x: 0, y: 0, z: 0, ry: 0 }); scene.add(h);
h.updateMatrixWorld(true);
const b = h.userData.bones; const head0 = b.Head.getWorldPosition(new THREE.Vector3());
// Kopf gerade nach vorn ausrichten (Blick auf einen Punkt 2 m vor dem Gesicht, Augenhöhe)
lookAt(h, new THREE.Vector3(head0.x, head0.y + 0.07, head0.z + 2), 1);
const face = h.userData.face; face.expr(Q.get('expr') || 'neutral', qn('ek', 1), Q.has('jaw') ? { jawOpen: qn('jaw', 0) } : {});
h.updateMatrixWorld(true);
const hp = b.Head.getWorldPosition(new THREE.Vector3());
const fc = hp.clone().add(new THREE.Vector3(0, qn('ty', 0.035), 0.06)); // Gesichtsmitte (zwischen Nase und Mund)
const yaw = qn('yaw', 0) * Math.PI / 180, pitch = qn('pitch', 4) * Math.PI / 180, dist = qn('dist', 0.6);
const camPos = fc.clone().add(new THREE.Vector3(Math.sin(yaw) * Math.cos(pitch), Math.sin(pitch), Math.cos(yaw) * Math.cos(pitch)).multiplyScalar(dist));
spot(0xffd8b0, qn('keyI', 22), [-1.1, 2.4, 1.8], [hp.x, hp.y, hp.z], 0.45, 0.9, true);
spot(0xff5ad0, qn('rimI', 40), [1.2, 2.2, -1.4], [hp.x, hp.y - 0.1, hp.z], 0.5, 0.7);
spot(0x8a7aff, 18, [-1.3, 1.9, -1.2], [hp.x, hp.y - 0.15, hp.z], 0.5, 0.7);
spot(0x9ab0ff, qn('fillI', 5), [1.4, 1.5, 1.6], [hp.x, hp.y - 0.1, hp.z], 0.6, 0.9);
stage.view({ pos: camPos.toArray(), target: fc.toArray(), fov: qn('fov', 24) }).build({ focus: fc, aperture: qn('ap', 0.0004), maxblur: 0.004 }).ready();
</script>
</body>
</html>
