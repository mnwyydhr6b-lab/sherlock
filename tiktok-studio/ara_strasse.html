<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;padding:0;background:#000;overflow:hidden}#wrap{position:relative;width:1080px;height:1920px;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<div id="wrap"></div>
<script type="importmap">
{ "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }
</script>
<script type="module">
// Vergleich alte/neue Figuren in derselben Szene (Straße nachts): Du tippt am Handy, Mia redet mit ihm.
// ara_strasse.html?mode=alt | mode=neu&du=du_tw&mia=mia_tw | mode=moves (alte Figuren mit übertragenen Bewegungen)
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { createStage } from './kit_look.js';
import { buildStrasse, SW } from './set_strasse.js';
import { loadHumanAssets, spawn, posePhone, lookAt } from './kit_cast.js';
import { loadMoves, retarget, faceFromMoves, showPhone } from './kit_retarget.js';
const stage = createStage({ preset: 'nacht' });
const { scene, qn, Q } = stage;
const DU = new THREE.Vector3(5.35, SW, 3.0), MIA = new THREE.Vector3(qn('mx', 6.1), SW, qn('mz', 2.95));
const ryDu = -1.25, ryMia = Math.atan2(DU.x - MIA.x, DU.z - MIA.z);
async function main() {
  await buildStrasse(stage, { party: true });
  let focus;
  if (Q.get('mode') === 'moves') {
    await loadHumanAssets(); const mm = await loadMoves('m'), mf = await loadMoves('f');
    const play = (h, moves, name, t) => { const c = retarget(h, moves, name); const mx = h.userData.mixer; mx.stopAllAction(); mx.clipAction(c).play(); mx.setTime(t); h.userData.applyBuild(); showPhone(h, !!c.userData.phone); h.updateMatrixWorld(true); if (c.userData.face) h.userData.face.set(faceFromMoves(c, t)); return c; };
    const du = spawn('du', { anim: 'Idle_Loop', x: DU.x, y: DU.y, z: DU.z, ry: ryDu }); scene.add(du); play(du, mm, Q.get('dumove') || 'Texting', qn('tdu', 2.0));
    const mia = spawn('mia', { anim: 'Idle_Loop', x: MIA.x, y: MIA.y, z: MIA.z, ry: ryMia }); scene.add(mia); play(mia, mf, Q.get('miamove') || 'Talk with gestures', qn('tmia', 1.5));
    mia.userData.face.set({ smileL: 0.5, smileR: 0.5 });
    focus = du.userData.bones.Head.getWorldPosition(new THREE.Vector3());
  } else if (Q.get('mode') === 'alt') {
    await loadHumanAssets();
    const du = spawn('du', { anim: 'Idle_Loop', time: 1.0, x: DU.x, y: DU.y, z: DU.z, ry: ryDu }); scene.add(du); posePhone(du);
    const mia = spawn('mia', { anim: 'Idle_Talking_Loop', time: 1.4, x: MIA.x, y: MIA.y, z: MIA.z, ry: ryMia }); scene.add(mia);
    lookAt(mia, du.userData.bones.Head.getWorldPosition(new THREE.Vector3()), 0.8); mia.userData.face.expr('happy', 0.6);
    focus = du.userData.bones.Head.getWorldPosition(new THREE.Vector3());
  } else {
    const loader = new GLTFLoader();
    const put = async (file, pos, ry, clipName, t, morph = {}) => {
      const g = await loader.loadAsync(`assets/ara_test/${file}.glb`); const root = g.scene; root.position.copy(pos); root.rotation.y = ry;
      root.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; o.frustumCulled = false;
        const ms = Array.isArray(o.material) ? o.material : [o.material]; ms.forEach(m => { if (/hair/i.test(m.name)) { m.alphaTest = qn('hairA', 0.04); m.transparent = true; m.depthWrite = true; m.side = THREE.DoubleSide; } }); }
        if (o.morphTargetDictionary) for (const [k, v] of Object.entries(morph)) { const i = o.morphTargetDictionary[k]; if (i !== undefined) o.morphTargetInfluences[i] = v; } });
      scene.add(root); console.log(file, 'clips:', g.animations.map(c => c.name).join(' | '));
      const clip = g.animations.find(c => c.name.toLowerCase() === clipName) || g.animations.find(c => c.name.toLowerCase().includes(clipName)) || g.animations[0];
      const mixer = new THREE.AnimationMixer(root); mixer.clipAction(clip).play(); mixer.setTime(t); root.updateMatrixWorld(true);
      let head = null; root.traverse(o => { if (o.isBone && /head$/i.test(o.name) && !head) head = o; }); return { root, head };
    };
    const du = await put(Q.get('du') || 'du_tw', DU, ryDu, 'texting', qn('tdu', 2.0));
    await put(Q.get('mia') || 'mia_tw', MIA, ryMia, Q.get('miaclip') || 'talk with gestures', qn('tmia', 1.5), { mouthSmile: 0.45 });
    focus = du.head ? du.head.getWorldPosition(new THREE.Vector3()) : DU.clone().add(new THREE.Vector3(0, 1.6, 0));
  }
  stage.limitLights(focus, 8);
  stage.view({ pos: [qn('cx', 3.05), qn('cy', 1.62), qn('cz', 4.35)], target: [qn('tx', 5.75), qn('ty', 1.25), qn('tz', 2.55)], fov: qn('fov', 44) }).build({ focus }).ready();
}
main().catch(e => console.error('BUILD ERROR', e.message, e.stack));
</script>
</body>
</html>
