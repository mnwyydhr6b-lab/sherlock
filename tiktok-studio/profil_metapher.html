<style>html,body{margin:0;padding:0;background:#000;overflow:hidden}#wrap{position:relative;width:1080px;height:1080px;overflow:hidden}canvas{display:block}</style>

<body>
<div id="wrap"></div>
<script type="importmap">
{ "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }

<script type="module">
// Profilbild als Metapher (1080x1080): ?v=buch (leeres Regelbuch, aus dem Licht aufsteigt) | ?v=schild (Verkehrsschild ohne Aufschrift unter einer Laterne)
import * as THREE from 'three';
import { createStage } from './kit_look.js';
import { cnv, tex, makeRng, std, rbox, add, fbm } from './kit_world.js';

const W = 1080, H = 1080;
const stage = createStage({ preset: 'studio', W, H, shadowExtent: 2 });
const { scene, qn, Q } = stage; const v = Q.get('v') || 'buch';
stage.keyLight.intensity *= 0.15; if (stage.rimLight) stage.rimLight.intensity *= 0.2; stage.hemi.intensity *= 0.35;
const r = makeRng(7);
function backdrop(c1, c2, bokehCols, n = 30, y0 = 0.1) { const S = 1024, c = cnv(S, S), g = c.getContext('2d');
  const bg = g.createRadialGradient(S * 0.5, S * 0.42, 40, S * 0.5, S * 0.5, S * 0.72); bg.addColorStop(0, c1); bg.addColorStop(1, c2); g.fillStyle = bg; g.fillRect(0, 0, S, S);
  for (let i = 0; i < n; i++) { const x = S * r(), y = S * (y0 + r() * 0.8), rad = 15 + r() * 60, col = bokehCols[i % bokehCols.length], a = 0.08 + r() * 0.22; const gr = g.createRadialGradient(x, y, 0, x, y, rad); gr.addColorStop(0, `rgba(${col},${a})`); gr.addColorStop(0.7, `rgba(${col},${a * 0.7})`); gr.addColorStop(1, `rgba(${col},0)`); g.fillStyle = gr; g.beginPath(); g.arc(x, y, rad, 0, 6.28); g.fill(); }
  const m = new THREE.Mesh(new THREE.PlaneGeometry(9, 9), new THREE.MeshBasicMaterial({ map: tex(c), toneMapped: false, fog: false })); return m; }
const spot = (col, I, p, tgt, ang = 0.5, pen = 0.8, shadow = false) => { const s = new THREE.SpotLight(col, I, 10, ang, pen, 1.5); s.position.set(...p); s.target.position.set(...tgt); s.castShadow = shadow; if (shadow) { s.shadow.mapSize.set(1024, 1024); s.shadow.bias = -0.0002; } scene.add(s, s.target); return s; };
// soft glow sprite texture
const glowTex = (() => { const c = cnv(128, 128), g = c.getContext('2d'); const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64); gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.25, 'rgba(255,240,200,0.6)'); gr.addColorStop(1, 'rgba(255,220,160,0)'); g.fillStyle = gr; g.fillRect(0, 0, 128, 128); return tex(c); })();

if (v === 'buch') {
  const bd = backdrop('#1a0f08', '#020203', ['255,190,110', '255,150,80', '255,230,170'], 18, 0.05); bd.position.set(0, 0.2, -3.5); scene.add(bd);
  const book = new THREE.Group(); scene.add(book);
  // leather covers (open V)
  const leatherC = cnv(256, 256); { const g = leatherC.getContext('2d'); const n = fbm(256, 256, 8, 4); const id = g.createImageData(256, 256); for (let i = 0; i < 256 * 256; i++) { const k = 0.75 + n[i] * 0.4; id.data[i * 4] = 110 * k; id.data[i * 4 + 1] = 36 * k; id.data[i * 4 + 2] = 28 * k; id.data[i * 4 + 3] = 255; } g.putImageData(id, 0, 0); g.strokeStyle = 'rgba(230,180,90,0.8)'; g.lineWidth = 6; g.strokeRect(20, 20, 216, 216); }
  const leather = std(0xffffff, 0.55, 0.05, { map: tex(leatherC) });
  for (const s of [-1, 1]) { const cv = add(book, rbox(0.34, 0.018, 0.46, 0.008), leather, s * 0.17, 0, 0); cv.rotation.z = s * 0.12; cv.position.y = 0.012 + 0.01; }
  add(book, new THREE.CylinderGeometry(0.03, 0.03, 0.46, 16, 1, false, Math.PI, Math.PI), leather, 0, 0.0, 0, { rx: Math.PI / 2 });
  // curved page blocks
  const paperC = cnv(256, 256); { const g = paperC.getContext('2d'); const n = fbm(256, 256, 16, 3); const id = g.createImageData(256, 256); for (let i = 0; i < 256 * 256; i++) { const k = 0.93 + n[i] * 0.08; id.data[i * 4] = 246 * k; id.data[i * 4 + 1] = 232 * k; id.data[i * 4 + 2] = 200 * k; id.data[i * 4 + 3] = 255; } g.putImageData(id, 0, 0); }
  const edgeC = cnv(64, 256); { const g = edgeC.getContext('2d'); g.fillStyle = '#efe0c0'; g.fillRect(0, 0, 64, 256); for (let y = 0; y < 256; y += 3) { g.fillStyle = `rgba(120,95,60,${0.15 + Math.random() * 0.25})`; g.fillRect(0, y, 64, 1); } }
  const paper = new THREE.MeshStandardMaterial({ color: 0xffffff, map: tex(paperC), roughness: 0.85, emissive: 0xffc070, emissiveIntensity: qn('pageGlow', 0.22) });
  for (const s of [-1, 1]) { const g = new THREE.BoxGeometry(0.3, 0.05, 0.42, 30, 1, 2); const P = g.attributes.position;
    for (let i = 0; i < P.count; i++) { let x = P.getX(i), y = P.getY(i); const u = (x + 0.15) / 0.3; const lift = s > 0 ? (1 - u) : u; const curve = Math.sin(Math.min(1, lift) * Math.PI * 0.5) * 0.05 + (y > 0 ? 0.012 * Math.sin(u * Math.PI) : 0); P.setY(i, y + curve * (y > 0 ? 1 : 0.4)); }
    g.computeVertexNormals(); const pb = add(book, g, paper, s * 0.165, 0.045, 0); pb.rotation.z = s * 0.1; }
  // ribbon bookmark
  const rib = new THREE.Mesh(new THREE.PlaneGeometry(0.018, 0.26, 1, 8), new THREE.MeshStandardMaterial({ color: 0xa0161e, roughness: 0.6, side: THREE.DoubleSide })); const rp = rib.geometry.attributes.position; for (let i = 0; i < rp.count; i++) { const y = rp.getY(i); rp.setZ(i, Math.sin((y + 0.13) * 9) * 0.01); } rib.geometry.computeVertexNormals(); rib.position.set(0.01, 0.02, 0.32); rib.rotation.x = -1.2; if (Q.has('ribbon')) book.add(rib);
  book.rotation.x = 0.0; book.position.set(0, 0, 0);
  // light rising from the pages: additive shafts + particles
  const shaftMat = (op) => new THREE.MeshBasicMaterial({ color: 0xffd28a, transparent: true, opacity: op, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, fog: false });
  const rayC = cnv(64, 256); { const g = rayC.getContext('2d'); const gr = g.createLinearGradient(0, 256, 0, 0); gr.addColorStop(0, 'rgba(255,225,160,1)'); gr.addColorStop(0.35, 'rgba(255,210,140,0.45)'); gr.addColorStop(1, 'rgba(255,200,120,0)'); g.fillStyle = gr; g.fillRect(0, 0, 64, 256); const gx = g.createLinearGradient(0, 0, 64, 0); gx.addColorStop(0, 'rgba(0,0,0,1)'); gx.addColorStop(0.5, 'rgba(0,0,0,0)'); gx.addColorStop(1, 'rgba(0,0,0,1)'); g.globalCompositeOperation = 'destination-out'; g.fillStyle = gx; g.fillRect(0, 0, 64, 256); }
  const rayT = tex(rayC);
  for (let i = 0; i < 14; i++) { const h = 0.6 + r() * 0.8, wd = 0.08 + r() * 0.16; const m = new THREE.MeshBasicMaterial({ map: rayT, color: 0xffd9a0, transparent: true, opacity: 0.1 + r() * 0.12, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, fog: false });
    const ray = new THREE.Mesh(new THREE.PlaneGeometry(wd, h), m); ray.position.set((r() - 0.5) * 0.28, 0.07 + h / 2, (r() - 0.5) * 0.2); ray.rotation.set(0, r() * Math.PI, (r() - 0.5) * 0.35); scene.add(ray); }
  const pts = new THREE.Group(); scene.add(pts);
  for (let i = 0; i < 45; i++) { const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: [0xffe2a8, 0xffc070, 0xfff4d8][i % 3], transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0.5 + r() * 0.5 })); const hh = Math.pow(r(), 0.8) * 1.0; sp.position.set((r() - 0.5) * (0.25 + hh * 0.6), 0.1 + hh, (r() - 0.5) * (0.25 + hh * 0.4)); sp.scale.setScalar(0.008 + r() * 0.02); pts.add(sp); }
  // faint floating glyphs (the "unwritten" rules) dissolving in the light
  const glyphC = cnv(512, 512); { const g = glyphC.getContext('2d'); g.clearRect(0, 0, 512, 512); g.fillStyle = 'rgba(255,230,180,0.9)'; g.font = 'italic 44px Georgia, serif'; const words = ['§', '!', 'Regel', '?', '…', '§', 'Respekt']; for (let i = 0; i < 9; i++) { g.globalAlpha = 0.25 + r() * 0.5; g.fillText(words[i % words.length], 40 + r() * 400, 60 + r() * 420); } }
  const gl = new THREE.Mesh(new THREE.PlaneGeometry(0.7, 0.7), new THREE.MeshBasicMaterial({ map: tex(glyphC), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, opacity: qn('glyphs', 0.0), fog: false })); gl.position.set(0, 0.55, 0.05); if (qn('glyphs', 0) > 0) scene.add(gl);
  // lights
  const L = new THREE.PointLight(0xffc878, qn('bookL', 1.6), 2.5, 1.6); L.position.set(0, 0.25, 0.02); scene.add(L);
  spot(0xffb070, 6, [0.8, 1.2, 1.4], [0, 0.05, 0], 0.5, 0.9, true); spot(0x7a8aff, 3, [-1.2, 0.8, -0.6], [0, 0.05, 0], 0.6, 0.8);
  add(scene, new THREE.CircleGeometry(1.2, 48), std(0x140c08, 0.9), 0, -0.002, 0, { rx: -Math.PI / 2, cast: false });
  stage.view({ pos: [qn('cx', 0.12), qn('cy', 1.0), qn('cz', 1.3)], target: [0, qn('ty2', 0.34), 0], fov: qn('fov', 38) }).build({ focus: new THREE.Vector3(0, 0.08, 0), aperture: qn('ap', 0.0012), maxblur: 0.006 }).ready();
}

if (v === 'schild') {
  const bd = backdrop('#162042', '#04050c', ['255,200,120', '255,170,90', '140,170,255', '255,110,180'], 40, 0.35); bd.position.set(0, 2.0, -4); bd.scale.setScalar(2.2); scene.add(bd);
  // pole + empty round sign (red ring, white face, slightly dirty), stickers
  const pole = std(0x9aa0a6, 0.35, 0.8); add(scene, new THREE.CylinderGeometry(0.03, 0.03, 2.6, 16), pole, 0, 1.3, 0);
  const sc = cnv(512, 512); { const g = sc.getContext('2d'); g.clearRect(0, 0, 512, 512); g.beginPath(); g.arc(256, 256, 250, 0, 6.28); g.fillStyle = '#d61f26'; g.fill(); g.beginPath(); g.arc(256, 256, 186, 0, 6.28); g.fillStyle = '#f7f6f1'; g.fill();
    const n = fbm(128, 128, 4, 3); for (let i = 0; i < 1400; i++) { const x = Math.random() * 512, y = Math.random() * 512; g.fillStyle = `rgba(80,70,60,${Math.random() * 0.05})`; g.fillRect(x, y, 3, 3); }
    g.fillStyle = 'rgba(60,50,40,0.12)'; g.beginPath(); g.ellipse(300, 380, 90, 30, 0.3, 0, 6.28); g.fill(); }
  const signM = std(0xffffff, 0.35, 0.1, { map: tex(sc), transparent: true });
  const sign = new THREE.Group(); sign.position.set(0, 2.3, 0.04); sign.rotation.set(0, -0.25, qn('tilt', 0.06)); scene.add(sign);
  add(sign, new THREE.CircleGeometry(0.32, 64), signM, 0, 0, 0.012, { cast: true });
  add(sign, new THREE.CylinderGeometry(0.325, 0.325, 0.018, 64), std(0xb8bcc0, 0.3, 0.8), 0, 0, 0, { rx: Math.PI / 2 });
  // sticker
  const st = cnv(128, 128); { const g = st.getContext('2d'); g.fillStyle = '#ffd400'; g.beginPath(); g.arc(64, 64, 60, 0, 6.28); g.fill(); g.fillStyle = '#111'; g.font = 'bold 70px Arial'; g.textAlign = 'center'; g.fillText('?', 64, 88); }
  add(sign, new THREE.CircleGeometry(0.04, 24), std(0xffffff, 0.5, 0, { map: tex(st) }), -0.2, -0.22, 0.014, { cast: false, rz: 0.3 });
  // street lamp light from above + volumetric cone
  const lampPos = [0.45, 3.6, 0.6]; const sp = spot(0xffd6a0, qn('lampI', 14), lampPos, [0, 2.2, 0], 0.45, 0.6, true);
  const cone = new THREE.Mesh(new THREE.ConeGeometry(0.9, 2.2, 32, 1, true), new THREE.MeshBasicMaterial({ color: 0xffd6a0, transparent: true, opacity: 0.018, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, fog: false })); cone.position.set(0.32, 2.5, 0.45); cone.rotation.z = 0.12; if (Q.has('cone')) scene.add(cone);
  spot(0xff5ad0, 6, [-1.2, 2.0, -1.0], [0, 2.3, 0], 0.5, 0.8);
  add(scene, new THREE.PlaneGeometry(6, 6), std(0x141418, 0.7, 0.2), 0, 0, 0, { rx: -Math.PI / 2, cast: false });
  stage.view({ pos: [qn('cx', 0.4), qn('cy', 1.9), qn('cz', 2.3)], target: [0, qn('ty2', 2.3), 0], fov: qn('fov', 36) }).build({ focus: new THREE.Vector3(0, 2.3, 0), aperture: qn('ap', 0.0012), maxblur: 0.008 }).ready();
}
</script>
