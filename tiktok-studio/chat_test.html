<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;padding:0;background:#000;overflow:hidden}#wrap{position:relative;width:1080px;height:1920px;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<div id="wrap"></div>
<script type="importmap">
{ "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }
</script>
<script type="module">
// Beispiel Handy-Chat (Folge 2 „Schreib nicht dreimal“): Du sitzt nachts auf dem Bett, Ego-Perspektive.
// chat_test.html?mode=hand    -> Chat auf dem Handy in deinen Händen (wie Leons Story im Testclip, nur näher an den Augen)
// chat_test.html?mode=overlay -> Chat groß als 2D-Einblendung über der abgedunkelten Szene
import * as THREE from 'three';
import { createStage } from './kit_look.js';
import { buildZimmer, ZANCHOR } from './set_zimmer.js';
import { loadHumanAssets, sitOn } from './kit_cast.js';
import { spawnBlock, povHide, povCamera, povPhoneRig, chatTex } from './kit_block.js';
import { createHUD } from './kit_hud.js';
const stage = createStage({ preset: 'innen_nacht', shadowExtent: 8 });
const { scene, qn, Q } = stage; const mode = Q.get('mode') || 'hand';
async function main() {
  buildZimmer(stage, {});
  await loadHumanAssets();
  const du = spawnBlock('du', { anim: 'Sitting_Idle_Loop', time: 0.8, x: 0, y: 0, z: 0, ry: qn('hry', 1.19) }); scene.add(du);
  sitOn(du, ZANCHOR.bedSide.clone()); povHide(du);
  const hud = await createHUD(); hud.loc('ZIMMER · 22:14'); hud.counter(qn('v', 72), 0); hud.hud(1);
  const msgs = [{ me: true, text: 'hey', time: '22:09' }, { me: true, text: '??', time: '22:12' }, { me: true, text: 'alles gut?', time: '22:14' }];
  const eye = povCamera(stage, du, { pitch: qn('pitch', -0.32), fov: 62 });
  const dir = stage.camera.getWorldDirection(new THREE.Vector3());
  let focus = eye.clone().addScaledVector(dir, 1.4);
  if (mode === 'hand') { const phone = povPhoneRig(stage, du, { screen: chatTex({ name: 'Mia', msgs, seen: 'Gelesen 22:14' }) }); phone.set(1, qn('zoom', 1)); focus = eye.clone().addScaledVector(dir, 0.25); }
  else { // 2D-Einblendung direkt hinter dem 3D-Bild einsortieren, damit Zähler und Ort oben drüber liegen
    const wrap = document.getElementById('wrap'), after = stage.renderer.domElement.nextSibling;
    const dim = document.createElement('div'); dim.style.cssText = 'position:absolute;inset:0;background:rgba(6,6,14,0.5);'; wrap.insertBefore(dim, after);
    const frame = document.createElement('div'); frame.style.cssText = 'position:absolute;left:50%;top:470px;transform:translateX(-50%);width:600px;padding:14px;border-radius:58px;background:#0a0a0d;box-shadow:0 40px 90px rgba(0,0,0,0.7), inset 0 0 0 2px #2a2a30;';
    const cv = chatTex({ name: 'Mia', msgs, seen: 'Gelesen 22:14' }).image; cv.style.cssText = 'display:block;width:100%;border-radius:44px;'; frame.appendChild(cv); wrap.insertBefore(frame, after); }
  stage.limitLights(eye, 8);
  stage.build({ focus }).ready();
}
main().catch(e => console.error('BUILD ERROR', e.message, e.stack));
</script>
</body>
</html>
