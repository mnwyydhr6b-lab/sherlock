const { scene, Q, qn } = stage; stage.keyLight.intensity *= 0.55; if (stage.rimLight) stage.rimLight.intensity *= 0.5; stage.hemi.intensity *= 0.85;
{ const S = 1024, c = cnv(S, S), g = c.getContext('2d'); const r = makeRng(5);
  const bg = g.createRadialGradient(S * 0.55, S * 0.4, 40, S * 0.5, S * 0.5, S * 0.8); bg.addColorStop(0, '#2a2552'); bg.addColorStop(0.6, '#121330'); bg.addColorStop(1, '#07070f'); g.fillStyle = bg; g.fillRect(0, 0, S, S);
  for (let i = 0; i < 26; i++) { const x = S * r(), y = S * r(), rad = 20 + r() * 70, a = 0.08 + r() * 0.2; const gr = g.createRadialGradient(x, y, 0, x, y, rad); gr.addColorStop(0, `rgba(255,170,220,${a})`); gr.addColorStop(1, 'rgba(255,170,220,0)'); g.fillStyle = gr; g.beginPath(); g.arc(x, y, rad, 0, 6.28); g.fill(); }
  const bd = new THREE.Mesh(new THREE.PlaneGeometry(16, 8), new THREE.MeshBasicMaterial({ map: tex(c), toneMapped: false, fog: false })); bd.position.set(0, 2, -3.5); scene.add(bd); }

  const x = (i - (n - 1) / 2) * gap; const h = spawnBlock(name, { x, y: 0, z: 0, ry: qn('ry', 0.15) }); scene.add(h);
