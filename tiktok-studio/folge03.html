    { t: CUT2, d: 0.01, p: ground }, { t: 30.55, d: 0.6, p: () => F(mia)().lerp(F(creep)(), 0.5) }, { t: 31.35, d: 0.5, p: F(creep) }, { t: 32.3, d: 0.6, p: F(mia) }];
  const P = stage.P;
  window.renderFrame = (t) => {
    for (const a of actors) a.update(t); syncPhone(mia); S.swayAt(t);
    mia.visible = true; creep.visible = t > CUT1;
    const duH = headOf(du, 0.12)();
    // Köpfe
    if (t < 1.95) lookAt(mia, duH, 0.8);
    if (t > CUT2 && t < 34.2) lookAt(mia, F(creep)().lerp(duH, smooth((t - 32.0) / 0.8)), 0.7); else if (t >= 34.2) lookAt(mia, duH, 0.85);
    if (t < CUT1) lookAt(leon, duH, 0.85); else lookAt(leon, t > RUN ? headOf(du, 0)() : duH, t > 9.4 && t < 18.5 || t > RUN ? 0.8 : 0.35);
    yard.forEach((h, i) => lookAt(h, t > 9.5 && t < 12.6 && i < 2 ? duH : F(leon)(), 0.5));
    // Gesichter
    mia.userData.blockFace.set(t < CUT1 ? 'happy' : t < 34.3 ? 'scared' : 'relieved', { blink: blinkAt(t, 7), talk: Math.max(lip(t, 'geh'), lip(t, 'hallo'), lip(t, 'danke')) });
    creep.userData.blockFace.set(t > 31.8 ? 'sideeye' : 'neutral', { blink: blinkAt(t, 13) });
    const leonExpr = t < CUT1 ? 'happy' : t > RUN ? 'surprised' : t > 12.5 && t < 14.6 ? 'smirk' : t > 9.6 && t < 12.5 ? 'neutral' : 'laugh';
    leon.userData.blockFace.set(t > 9.4 && t < 18.6 && leonExpr === 'laugh' ? 'happy' : leonExpr, { blink: blinkAt(t, 9), talk: Math.max(lip(t, 'runde'), lip(t, 'chill'), lip(t, 'wohin')) });
    const party = (t > 8.0 && t < 9.7) || (t > 18.7 && t < 21.3) || t < 3.0;
    ben.userData.blockFace.set(t > RUN ? 'surprised' : party ? 'laugh' : 'happy', { blink: blinkAt(t, 4), talk: party ? Math.max(0, Math.sin(t * 9)) * 0.7 : 0 });
    jas.userData.blockFace.set(t > RUN ? 'surprised' : party ? 'laugh' : 'smirk', { blink: blinkAt(t, 5), talk: party ? Math.max(0, Math.sin(t * 8)) * 0.7 : 0 });
    teal.userData.blockFace.set(party ? 'laugh' : 'happy', { blink: blinkAt(t, 6), talk: party ? Math.max(0, Math.sin(t * 10)) * 0.7 : 0 });
    // Ego-Kamera
    const running = t > RUN && t < tArrive, walking = t > 7.05 && t < CUT1;
    const st = povPose(du, { steady: true, pitch: -0.05, bob: walking ? 0.012 : 0, t });
    if (running) { const f = t < runB[0][0] ? 2.3 : 2.7, a = t < runB[0][0] ? 0.022 : 0.032; st.eye.y += a * Math.abs(Math.sin(t * Math.PI * f)) - a * 0.5; }
    const kPh = kPhAt(t), scr = screenAt(t); if (scr !== curScr) { phone.setScreen(scr); curScr = scr; } phone.set(kPh, zoomAt(t));
    const dir = lookDir(t, st, look); dir.y -= 0.08 * kPh; dir.normalize();
    if (running) { const sw = Math.sin(t * Math.PI * 2.7) * 0.012; dir.x += sw * Math.cos(du.rotation.y); dir.z -= sw * Math.sin(du.rotation.y); dir.normalize(); } // leichtes Pendeln beim Rennen
    const cam = stage.camera; cam.position.copy(st.eye); cam.lookAt(st.eye.clone().add(dir)); cam.fov = t > CUT1 && t < RUN ? 64 : 60; cam.near = 0.03; cam.updateProjectionMatrix();
    if (stage.passes.bokeh) { const kb = smooth((t - 29.15) / 0.3) * (1 - smooth((t - 30.35) / 0.3)); stage.passes.bokeh.uniforms.aperture.value = 0.0008 + 0.006 * kb; stage.passes.bokeh.uniforms.maxblur.value = 0.0045 + 0.012 * kb; } // verdeckter Schnitt: Hintergrund hinter dem Handy stark unscharf
    const tg = [...look].reverse().find(s => s.t <= t); stage.setFocus(kPh > 0.5 ? st.eye.clone().addScaledVector(dir, 0.3) : tg && tg.p ? tg.p() : st.eye.clone().addScaledVector(dir, 3));
    // HUD
    hud.loc(t < CUT1 ? 'LINDENWEG 7 · 23:41' : t < RUN ? 'LINDENWEG 7 · 23:43' : 'LINDENWEG · 23:44');
    const c = counterAt(t, COUNTER); hud.counter(c.v, c.fl, c.up); hud.hud(1);
    stage.grade.uniforms.sat.value = 0.35 + (P.sat - 0.35) * Math.max(0, (c.v - 5) / 95);
    hud.hook(HOOK, smooth((t + 0.3) / 0.35) * (1 - smooth((t - 3.5) / 0.4))); // schon im ersten Bild sichtbar (Vorschaubild)
    let so = 0, txt = ''; for (const [a, b, s] of SUBS) { const k = Math.min(smooth((t - a) / 0.2), 1 - smooth((t - b + 0.2) / 0.2)); if (k > so) { so = k; txt = s; } }
    hud.subTop(kPh > 0.3 ? 560 : 1238); hud.sub(txt, so);
    hud.endCard(t - END, { nr: 3, rule: 'Lass niemanden allein nach Hause gehen.', question: 'Hättest du sie begleitet?', hook: HOOK });
    stage.render();
  };
  window.renderStill = () => { window.renderFrame(parseFloat(Q.get('t') || '1')); return true; };
  window.clipLength = LEN; window.ready = true;
}
main().catch(e => console.error('BUILD ERROR', e.message, e.stack));
