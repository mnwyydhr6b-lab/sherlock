<script type="module">
// Profilbild: Klötzchen-„Du“ + Regel-Motiv. profil_klotz.html?v=buch|fluestern|karte  (Rendern: node still.js "profil_klotz.html?v=buch&hq" out.png 2 1080 1080)
import * as THREE from 'three';
import { createStage } from './kit_look.js';
import { cnv, tex, makeRng, rbox } from './kit_world.js';
import { loadHumanAssets, lookAt } from './kit_cast.js';
import { armIK, rotBoneWorld } from './kit_human.js';
import { spawnBlock } from './kit_block.js';
const stage = createStage({ preset: 'studio', shadowExtent: 3, W: 1080, H: 1080 });
const { scene, Q, qn } = stage; const v = Q.get('v') || 'buch';
stage.keyLight.intensity *= 0.25; if (stage.rimLight) stage.rimLight.intensity *= 0.3; stage.hemi.intensity *= 0.55;
// Hintergrund: Nacht-Bokeh der Serie (Lichterketten, Fenster)
{ const S = 1024, c = cnv(S, S), g = c.getContext('2d'); const r = makeRng(7);
  const bg = g.createRadialGradient(S * 0.5, S * 0.42, 40, S * 0.5, S * 0.5, S * 0.75); bg.addColorStop(0, '#2b2258'); bg.addColorStop(0.55, '#141333'); bg.addColorStop(1, '#06060f'); g.fillStyle = bg; g.fillRect(0, 0, S, S);
  const cols = ['255,190,110', '255,110,200', '170,130,255', '255,220,150'];
  for (let i = 0; i < 46; i++) { const x = S * r(), y = S * (0.05 + r() * 0.7), rad = 14 + r() * 60, col = cols[i % 4], a = 0.15 + r() * 0.35; const gr = g.createRadialGradient(x, y, 0, x, y, rad); gr.addColorStop(0, `rgba(${col},${a})`); gr.addColorStop(0.75, `rgba(${col},${a * 0.7})`); gr.addColorStop(1, `rgba(${col},0)`); g.fillStyle = gr; g.beginPath(); g.arc(x, y, rad, 0, 6.28); g.fill(); }
  const bd = new THREE.Mesh(new THREE.PlaneGeometry(6, 6), new THREE.MeshBasicMaterial({ map: tex(c), toneMapped: false, fog: false })); bd.position.set(0, 1.5, -2.6); scene.add(bd); }
const spot = (col, I, p, tgt, ang = 0.5, pen = 0.8, shadow = false) => { const s = new THREE.SpotLight(col, I, 8, ang, pen, 1.5); s.position.set(...p); s.target.position.set(...tgt); s.castShadow = shadow; if (shadow) { s.shadow.mapSize.set(1024, 1024); s.shadow.bias = -0.0003; } scene.add(s, s.target); return s; };

await loadHumanAssets();
const du = spawnBlock('du', { anim: 'Idle_Loop', time: 0.6, x: 0, y: 0, z: 0, ry: 0 }); scene.add(du); du.updateMatrixWorld(true);
const b = du.userData.bones; const head = b.Head.getWorldPosition(new THREE.Vector3()); const chest = b.spine_03.getWorldPosition(new THREE.Vector3());
const camPos = new THREE.Vector3(qn('cx', 0.08), qn('cy', 1.62), qn('cz', 1.55));
const gold = new THREE.MeshStandardMaterial({ color: 0xffd36a, emissive: 0xffb43a, emissiveIntensity: 1.4, roughness: 0.35, metalness: 0.3 });
function emblem(text, size = 256, font = 'bold 200px Georgia') { const c = cnv(size, size), g = c.getContext('2d'); g.fillStyle = '#ffe3a0'; g.font = font; g.textAlign = 'center'; g.textBaseline = 'middle'; g.shadowColor = 'rgba(255,190,80,1)'; g.shadowBlur = 24; g.fillText(text, size / 2, size / 2 + 8); return tex(c); }
let focus = head.clone().add(new THREE.Vector3(0, 0.15, 0.1));
if (v === 'buch' || v === 'karte') {
  // Buch (oder Karte) vor der Brust, mit beiden Händen gehalten, Vorderseite zur Kamera
  const C = chest.clone().add(new THREE.Vector3(0, qn('by', v === 'buch' ? 0.03 : 0.06), 0.3));
  const grp = new THREE.Group(); grp.position.copy(C); grp.rotation.x = -0.12; scene.add(grp);
  if (v === 'buch') {
    const cover = new THREE.MeshPhysicalMaterial({ color: 0x5a1f2a, roughness: 0.55, clearcoat: 0.3 });
    const book = new THREE.Mesh(rbox(0.25, 0.33, 0.06, 0.012, 3), cover); book.castShadow = true; grp.add(book);
    const pages = new THREE.Mesh(rbox(0.235, 0.315, 0.05, 0.004, 2), new THREE.MeshStandardMaterial({ color: 0xf2e8d0, roughness: 0.9 })); pages.position.set(0.006, 0, 0); grp.add(pages);
    const frame = new THREE.Mesh(new THREE.RingGeometry(0.082, 0.09, 48), gold); frame.position.set(0, 0.045, 0.0315); grp.add(frame);
    const sym = new THREE.Mesh(new THREE.PlaneGeometry(0.15, 0.15), new THREE.MeshBasicMaterial({ map: emblem('§'), transparent: true, toneMapped: false })); sym.position.set(0, 0.045, 0.032); grp.add(sym);
    const glow = new THREE.PointLight(0xffc070, 0.6, 1.2, 2); glow.position.set(0, 0.05, 0.25); grp.add(glow);
  } else {
    const card = new THREE.Mesh(rbox(0.36, 0.24, 0.012, 0.012, 2), new THREE.MeshStandardMaterial({ color: 0xf6efe0, roughness: 0.8 })); card.castShadow = true; grp.add(card);
    const c = cnv(512, 336), g = c.getContext('2d'); g.fillStyle = '#f6efe0'; g.fillRect(0, 0, 512, 336); g.fillStyle = '#20182a'; g.textAlign = 'center'; g.font = '800 92px Inter, sans-serif'; g.fillText('REGEL', 256, 120); g.fillStyle = '#d23a4a'; g.font = '800 140px Inter, sans-serif'; g.fillText('Nr. ?', 256, 270);
    const face = new THREE.Mesh(new THREE.PlaneGeometry(0.345, 0.226), new THREE.MeshStandardMaterial({ map: tex(c), roughness: 0.8 })); face.position.z = 0.0065; grp.add(face);
  }
  grp.updateMatrixWorld(true); const w = v === 'buch' ? 0.13 : 0.185, hy = v === 'buch' ? -0.12 : -0.135;
  armIK(du, 'l', grp.localToWorld(new THREE.Vector3(w, hy, -0.02)), new THREE.Vector3(0.6, -1, -0.3)); armIK(du, 'r', grp.localToWorld(new THREE.Vector3(-w, hy, -0.02)), new THREE.Vector3(-0.6, -1, -0.3));
  lookAt(du, camPos, 0.85); du.userData.blockFace.set(Q.get('expr') || 'smirk');
} else {
  // Flüstern: Hand neben dem Mund, Kopf leicht geneigt, wissender Blick zur Kamera
  lookAt(du, camPos, 0.9); rotBoneWorld(du, b.Head, new THREE.Vector3(0, 0, 1), qn('tilt', 0.14));
  du.updateMatrixWorld(true); const hp = b.Head.getWorldPosition(new THREE.Vector3());
  armIK(du, 'r', hp.clone().add(new THREE.Vector3(-0.23, 0.07, 0.15)), new THREE.Vector3(-0.8, -1, -0.2));
  du.userData.blockFace.set(Q.get('expr') || 'smirk', { look: [0.15, 0] });
  const spark = new THREE.Mesh(new THREE.PlaneGeometry(0.11, 0.11), new THREE.MeshBasicMaterial({ map: emblem('!', 256, 'bold 210px Inter, sans-serif'), transparent: true, toneMapped: false })); spark.position.copy(hp).add(new THREE.Vector3(-0.3, 0.24, 0.15)); scene.add(spark);
}
du.updateMatrixWorld(true);
const hp = b.Head.getWorldPosition(new THREE.Vector3());
spot(0xffd8b0, qn('keyI', 11), [-1.0, 2.4, 1.8], [hp.x, hp.y, hp.z], 0.5, 0.9, true);
spot(0xff5ad0, qn('rimI', 24), [1.2, 2.2, -1.3], [hp.x, hp.y - 0.15, hp.z], 0.55, 0.7);
spot(0x8a7aff, 16, [-1.3, 1.9, -1.2], [hp.x, hp.y - 0.2, hp.z], 0.55, 0.7);
spot(0xb0c0ff, qn('fillI', 3), [1.3, 1.5, 1.6], [hp.x, hp.y - 0.15, hp.z], 0.7, 0.9);
const tgt = hp.clone().add(new THREE.Vector3(0, qn('toff', v === 'fluestern' ? 0.06 : -0.02), 0));
stage.view({ pos: camPos.toArray(), target: tgt.toArray(), fov: qn('fov', 34) }).build({ focus, aperture: qn('ap', 0.0011), maxblur: 0.007 }).ready();
</script>
