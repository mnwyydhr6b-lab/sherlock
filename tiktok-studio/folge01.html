  console.log('cut at x=10.9:', tAt(10.9).toFixed(2), 'walk speed', v.toFixed(3), 'greet', tGreet.toFixed(2), 'door', tAt(12.55).toFixed(2), 'hall', r2[r2.length - 1][0].toFixed(2));
