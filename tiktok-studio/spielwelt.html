    if (/glass|window/.test(n)) m.material = new THREE.MeshPhysicalMaterial({ color: 0x0c1016, roughness: 0.05, metalness: 0.2 });
    else if (/body|paint|main|car/.test(n) || m.material.color.getHSL({}).s > 0.25) { m.material = new THREE.MeshPhysicalMaterial({ color: col, roughness: 0.32, metalness: 0.45, clearcoat: 1, clearcoatRoughness: 0.08 }); } });
  for (const [k, x, z, ry, col] of [['n1', -2.4, -6.5, Math.PI, 0x2a4f7a], ['n2', -2.4, 12, Math.PI, 0xc9c9c9], ['suv', -2.4, -22, Math.PI, 0x7a1f22], ['n1', 2.4, -14.5, 0, 0x30343a], ['n2', 2.4, 19, 0, 0x4a5a3a], ['suv', 9.0, -6.9, -Math.PI / 2, 0x1d1f24]]) {
    const o = cars[k].scene.clone(true); o.position.set(x, x > 6 ? SW : 0, z); o.rotation.y = ry; carPaint(o, col); scene.add(o); }
  if (!Q.has('nochar')) await people();
  await partyProps();
  setupCamera();
}

    vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
    fragmentShader: `uniform sampler2D tDiffuse; uniform float sat, con, vig; varying vec2 vUv;
      void main(){ vec3 c = texture2D(tDiffuse, vUv).rgb; c = mix(c, c*c*(3.0-2.0*c), con); float l = dot(c, vec3(0.299,0.587,0.114)); c = mix(vec3(l), c, sat);
        c += vec3(-0.012, 0.0, 0.03) * (1.0 - l) * (1.0 - l) + vec3(0.025, 0.01, -0.012) * l * l;
        vec2 d = (vUv - 0.5) * vec2(1.0, 0.62); c *= 1.0 - dot(d, d) * vig; gl_FragColor = vec4(c, 1.0); }` });
