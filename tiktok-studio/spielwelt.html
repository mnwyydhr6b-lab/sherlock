<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;padding:0;background:#000;overflow:hidden}#wrap{position:relative;width:1080px;height:1920px;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<div id="wrap"></div>
<script type="importmap">
{ "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }
</script>
<script type="module">
// Key-Visual "Spielwelt": Du am Gartentor von Leons Party (Set: Straße, Preset: nacht)
import * as THREE from 'three';
import { createStage } from './kit_look.js';
import { buildStrasse, SW } from './set_strasse.js';
import { loadHumanAssets, spawn, posePhone, holdCup } from './kit_cast.js';

const stage = createStage({ preset: 'nacht' });
const { scene, qn, Q } = stage;
async function main() {
  await buildStrasse(stage, { party: true });
  let focus = new THREE.Vector3(5.35, 1.7, 3.05);
  if (!Q.has('nochar')) {
    await loadHumanAssets();
    const du = spawn('du', { anim: 'Idle_Loop', time: 1.0, x: qn('hx', 5.35), y: SW, z: qn('hz', 3.05), ry: qn('hry', -1.45) }); scene.add(du);
    posePhone(du);
    focus = du.userData.bones.Head.getWorldPosition(new THREE.Vector3());
    const guests = [
      spawn('jasmin', { anim: 'Dance_Loop', time: 1.3, x: 9.3, y: SW, z: -1.0, ry: -1.0 }),
      spawn('leon', { anim: 'Idle_Talking_Loop', time: 2.0, x: 10.0, y: SW, z: 2.0, ry: -2.4 }),
      spawn('mia', { anim: 'Idle_Loop', time: 0.7, x: 10.55, y: SW, z: 1.15, ry: -0.75 }),
      spawn('tarik', { anim: 'Dance_Loop', time: 0.4, x: 11.75, y: SW + 0.45, z: 0.55, ry: -1.57 }),
    ];
    guests.forEach(g => scene.add(g)); holdCup(guests[1], 'r');
  }
  stage.view({ pos: [1.0, 1.5, 6.0], target: [9.6, 2.55, 1.03], fov: 46 }).build({ focus }).ready();
}
main().catch(e => console.error('BUILD ERROR', e.message, e.stack));
</script>
</body>
</html>
