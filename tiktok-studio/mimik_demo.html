<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;padding:0;background:#000;overflow:hidden}#wrap{position:relative;width:1080px;height:1920px;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<div id="wrap"></div>
<script type="importmap">
{ "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }
</script>
<script type="module">
// Mimik-Demo (4,8 s, 1080x1920): Du schaut in die Kamera, blinzelt, lächelt gequält, sagt „Ich bleib nur kurz.“ (Lippen zur Stimme), wird traurig.
import * as THREE from 'three';
import { createStage } from './kit_look.js';
import { cnv, tex, makeRng } from './kit_world.js';
import { loadHumanAssets, spawn, lookAt } from './kit_cast.js';
import { EXPRESSIONS } from './kit_human.js';
import { Actor, keys, smooth, blinkAt, lipAt } from './kit_anim.js';
import { createHUD } from './kit_hud.js';

const stage = createStage({ preset: 'studio', shadowExtent: 3 });
const { scene } = stage; stage.keyLight.intensity *= 0.25; if (stage.rimLight) stage.rimLight.intensity *= 0.3; stage.hemi.intensity *= 0.5;
{ const S = 1024, c = cnv(S, S * 1.8 | 0), g = c.getContext('2d'); const r = makeRng(3); const H2 = c.height;
  const bg = g.createRadialGradient(S * 0.6, H2 * 0.35, 50, S * 0.5, H2 * 0.5, H2 * 0.7); bg.addColorStop(0, '#1b1840'); bg.addColorStop(0.6, '#0b0c1e'); bg.addColorStop(1, '#040409'); g.fillStyle = bg; g.fillRect(0, 0, S, H2);
  const cols = ['255,90,200', '255,200,110', '170,110,255', '255,140,170', '120,170,255'];
  for (let i = 0; i < 50; i++) { const x = S * r(), y = H2 * (0.05 + r() * 0.8), rad = 20 + r() * 80, col = cols[i % cols.length], a = 0.12 + r() * 0.3; const gr = g.createRadialGradient(x, y, 0, x, y, rad); gr.addColorStop(0, `rgba(${col},${a})`); gr.addColorStop(0.7, `rgba(${col},${a * 0.8})`); gr.addColorStop(1, `rgba(${col},0)`); g.fillStyle = gr; g.beginPath(); g.arc(x, y, rad, 0, 6.28); g.fill(); }
  const t = tex(c); const bd = new THREE.Mesh(new THREE.PlaneGeometry(5, 9), new THREE.MeshBasicMaterial({ map: t, toneMapped: false, fog: false })); bd.position.set(0.2, 1.6, -3.2); scene.add(bd); }
const spot = (col, I, p, tgt, ang = 0.5, pen = 0.8, shadow = false) => { const s = new THREE.SpotLight(col, I, 8, ang, pen, 1.5); s.position.set(...p); s.target.position.set(...tgt); s.castShadow = shadow; if (shadow) { s.shadow.mapSize.set(1024, 1024); s.shadow.bias = -0.0002; } scene.add(s, s.target); return s; };

await loadHumanAssets();
const env = await (await fetch('audio/du.env.json')).json();
const du = spawn('du', { anim: 'Idle_Loop', x: 0, y: 0, z: 0, ry: 0.12 }); scene.add(du);
const cam = { pos: [[0, [0.05, 1.68, 1.25]], [4.8, [0.02, 1.68, 0.95]]], target: [[0, [0, 1.6, 0]], [4.8, [0, 1.62, 0]]] };
const camPos = new THREE.Vector3();
const lookDown = (t) => smooth((t - 3.9) / 0.6) * 0.5;
const actor = new Actor(du, { segs: [{ anim: 'Idle_Loop', at: 0, offset: 0.6 }], after: (t, h) => { const p = camPos.clone(); p.y -= lookDown(t); lookAt(h, p, 0.85); } });
const spoke = 1.7, E = EXPRESSIONS;
const mixE = (a, b, k) => { const o = {}; for (const key of new Set([...Object.keys(E[a]), ...Object.keys(E[b])])) o[key] = (E[a][key] || 0) * (1 - k) + (E[b][key] || 0) * k; return o; };
const exprAt = (t) => t < 1.0 ? mixE('neutral', 'neutral', 0) : t < 3.8 ? mixE('neutral', 'awkward', smooth((t - 1.0) / 0.5)) : mixE('awkward', 'sad', smooth((t - 3.8) / 0.5));
stage.view({ pos: [0.05, 1.68, 1.25], target: [0, 1.6, 0], fov: 30 });
const hp0 = du.userData.bones.Head.getWorldPosition(new THREE.Vector3());
spot(0xffd8b0, 22, [-1.1, 2.4, 1.8], [hp0.x, hp0.y, hp0.z], 0.45, 0.9, true); spot(0xff5ad0, 40, [1.2, 2.2, -1.4], [hp0.x, hp0.y - 0.1, hp0.z], 0.5, 0.7); spot(0x8a7aff, 18, [-1.3, 1.9, -1.2], [hp0.x, hp0.y - 0.15, hp0.z], 0.5, 0.7); spot(0x9ab0ff, 4, [1.4, 1.5, 1.6], [hp0.x, hp0.y - 0.1, hp0.z], 0.6, 0.9);
stage.build({ focus: hp0, aperture: 0.0012, maxblur: 0.008 });
const hud = await createHUD(); hud.hud(0);
window.renderFrame = (t) => {
  const p = keys(t, cam.pos); camPos.set(p[0], p[1], p[2]);
  actor.update(t);
  const vals = exprAt(t); vals.blink = Math.max(vals.blink || 0, blinkAt(t, 3)); vals.jawOpen = Math.max(vals.jawOpen || 0, lipAt(t, env, spoke, 0.42)); du.userData.face.reset(); du.userData.face.set(vals);
  const g = keys(t, cam.target); stage.camera.position.copy(camPos); stage.camera.lookAt(g[0], g[1], g[2]);
  stage.setFocus(du.userData.bones.Head.getWorldPosition(new THREE.Vector3()));
  const so = Math.min(smooth((t - spoke + 0.1) / 0.2), 1 - smooth((t - spoke - 2.0) / 0.2)); hud.sub('„Ich bleib nur kurz.“', so);
  stage.render();
};
window.renderStill = () => { window.renderFrame(parseFloat(new URLSearchParams(location.search).get('t') || '2.4')); return true; };
window.ready = true;
</script>
</body>
</html>
