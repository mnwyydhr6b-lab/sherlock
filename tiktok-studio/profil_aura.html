<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;padding:0;background:#000;overflow:hidden}#wrap{position:relative;width:1080px;height:1080px;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<div id="wrap"></div>
<script type="importmap">
{ "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }
</script>
<script type="module">
// Profilbild „Aura“: Du lässig mit verschränkten Armen, halb geschlossenen Augen und Grinsen, Gegenlicht und leuchtende Aura um die Silhouette.
// profil_aura.html?v=3 (Sonnenbrille, gold) = gewähltes Profilbild von „Regeln TV“ (23.11.) -> kanal/profilbild.png. Weitere Farben: v=1 (blau), v=2 (lila).
// Rendern: node still.js "profil_aura.html?v=3&hq" out.png 2 1080 1080, danach mit PIL auf 1080×1080 verkleinern.
import * as THREE from 'three';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { FullScreenQuad } from 'three/addons/postprocessing/Pass.js';
import { createStage } from './kit_look.js';
import { cnv, tex, makeRng, rbox } from './kit_world.js';
import { loadHumanAssets, lookAt } from './kit_cast.js';
import { rotBoneWorld } from './kit_human.js';
import { spawnBlock } from './kit_block.js';
const stage = createStage({ preset: 'studio', shadowExtent: 3, W: 1080, H: 1080 });
const { scene, Q, qn } = stage; const v = Q.get('v') || '3';
const [cA, cB] = ({ 1: [0x46dcff, 0x2f5bff], 2: [0xff52dc, 0x7d3cff], 3: [0xffc24a, 0xff5a1f] })[v] || [0xff52dc, 0x7d3cff];
const glasses = Q.has('glasses') ? Q.get('glasses') === '1' : v === '3';
stage.keyLight.intensity *= 0.12; if (stage.rimLight) stage.rimLight.intensity *= 0.15; stage.hemi.intensity *= qn('hemiK', 0.3);

await loadHumanAssets();
const du = spawnBlock('du', { anim: Q.get('anim') || 'Idle_FoldArms_Loop', time: qn('t', 0.8), x: 0, y: 0, z: 0, ry: qn('ry', 0.3) }); scene.add(du); du.updateMatrixWorld(true);
const b = du.userData.bones, headCube = du.userData.blockParts[0];
let hcW = headCube.getWorldPosition(new THREE.Vector3());
const yaw = qn('yaw', 0.05), dist = qn('dist', 1.62);
const camPos = new THREE.Vector3(hcW.x + Math.sin(yaw) * dist, hcW.y + qn('cyo', -0.4), hcW.z + Math.cos(yaw) * dist);
lookAt(du, camPos, 0.9); rotBoneWorld(du, b.Head, new THREE.Vector3(1, 0, 0), qn('chin', -0.1)); du.updateMatrixWorld(true);
du.userData.blockFace.set(Q.get('expr') || 'cool');
hcW = headCube.getWorldPosition(new THREE.Vector3());

// Sonnenbrille (Variante 3): Teil des Kopf-Würfels, Koordinaten in Metern relativ zur Kopfmitte (z = Gesichtsseite)
if (glasses) { const HS = 0.285, fz = HS * 0.47 + 0.0015;
  const lensM = new THREE.MeshPhysicalMaterial({ color: 0x06060a, roughness: 0.05, metalness: 0.35, clearcoat: 1, clearcoatRoughness: 0.03 });
  const frameM = new THREE.MeshPhysicalMaterial({ color: 0x101014, roughness: 0.3, clearcoat: 0.8 });
  const put = (geo, m, x, y, z) => { const o = new THREE.Mesh(geo, m); o.position.set(x, y, z); o.castShadow = true; headCube.add(o); return o; };
  for (const sx of [-1, 1]) { put(rbox(0.094, 0.054, 0.012, 0.016, 3), lensM, sx * 0.055, 0.011, fz + 0.011);
    put(rbox(0.012, 0.012, HS * 0.84, 0.004, 2), frameM, sx * (HS / 2 + 0.004), 0.03, fz - HS * 0.42); }
  put(rbox(0.22, 0.017, 0.018, 0.006, 2), frameM, 0, 0.037, fz + 0.012); }

// Licht: wenig Frontlicht, starke farbige Kanten von hinten, leichtes Licht von unten
const spot = (col, I, p, tgt, ang = 0.5, pen = 0.8, shadow = false) => { const s = new THREE.SpotLight(col, I, 9, ang, pen, 1.5); s.position.set(...p); s.target.position.copy(tgt); s.castShadow = shadow; if (shadow) { s.shadow.mapSize.set(1024, 1024); s.shadow.bias = -0.0003; } scene.add(s, s.target); return s; };
const H = hcW;
spot(0xfff0e4, qn('keyI', 8), [H.x - 0.9, H.y + 1.1, H.z + 1.9], H.clone().add(new THREE.Vector3(0, -0.25, 0)), 0.5, 0.9, true);
spot(cA, qn('rimA', 46), [H.x - 1.35, H.y + 0.55, H.z - 1.3], H.clone().add(new THREE.Vector3(0, -0.3, 0)), 0.6, 0.6);
spot(cB, qn('rimB', 46), [H.x + 1.35, H.y + 0.35, H.z - 1.25], H.clone().add(new THREE.Vector3(0, -0.35, 0)), 0.6, 0.6);
spot(cA, qn('under', 1.8), [H.x + 0.3, H.y - 1.3, H.z + 1.1], H.clone().add(new THREE.Vector3(0, -0.2, 0)), 0.6, 0.9);

// Hintergrund: fast schwarz, Rauchschwaden in den Aura-Farben, heller Lichtkranz hinter dem Kopf mit Strahlen
const tgt = H.clone().add(new THREE.Vector3(0, qn('toff', -0.15), 0));
const onBack = (p, zb) => { const d = p.clone().sub(camPos).normalize(); return camPos.clone().addScaledVector(d, (zb - camPos.z) / d.z); };
const css = (c, a) => { const k = new THREE.Color(c); return `rgba(${Math.round(k.r * 255)},${Math.round(k.g * 255)},${Math.round(k.b * 255)},${a})`; };
{ const S = 1024, c = cnv(S, S), g = c.getContext('2d'); const r = makeRng(5);
  const bg = g.createRadialGradient(S * 0.5, S * 0.42, 20, S * 0.5, S * 0.5, S * 0.75); bg.addColorStop(0, '#16122a'); bg.addColorStop(0.55, '#09081a'); bg.addColorStop(1, '#020206'); g.fillStyle = bg; g.fillRect(0, 0, S, S);
  for (let i = 0; i < 34; i++) { const x = S * (0.1 + r() * 0.8), y = S * (0.15 + r() * 0.8), rad = 60 + r() * 170, col = r() < 0.5 ? cA : cB; const gr = g.createRadialGradient(x, y, 0, x, y, rad);
    gr.addColorStop(0, css(col, 0.05 + r() * 0.07)); gr.addColorStop(1, css(col, 0)); g.fillStyle = gr; g.beginPath(); g.ellipse(x, y, rad * 1.6, rad * 0.7, r() * 3, 0, 6.29); g.fill(); }
  const bd = new THREE.Mesh(new THREE.PlaneGeometry(9, 9), new THREE.MeshBasicMaterial({ map: tex(c), toneMapped: false, fog: false })); bd.position.copy(onBack(tgt, -2.9)); bd.lookAt(camPos); scene.add(bd); window.__bd = bd; }
{ const S = 1024, c = cnv(S, S), g = c.getContext('2d'); const r = makeRng(11);
  // Strahlen
  for (let i = 0; i < 46; i++) { const a = r() * Math.PI * 2, w = 0.01 + r() * 0.035, len = S * (0.32 + r() * 0.2); const gr = g.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, len);
    gr.addColorStop(0, css(i % 2 ? cA : cB, 0.32)); gr.addColorStop(1, css(i % 2 ? cA : cB, 0)); g.fillStyle = gr; g.beginPath(); g.moveTo(S / 2, S / 2); g.arc(S / 2, S / 2, len, a - w, a + w); g.closePath(); g.fill(); }
  // Lichtkranz
  const gr = g.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S * 0.36); gr.addColorStop(0, 'rgba(255,255,255,0.95)'); gr.addColorStop(0.16, css(cA, 0.85)); gr.addColorStop(0.45, css(cB, 0.35)); gr.addColorStop(1, css(cB, 0)); g.fillStyle = gr; g.fillRect(0, 0, S, S);
  const halo = new THREE.Mesh(new THREE.PlaneGeometry(4.2, 4.2), new THREE.MeshBasicMaterial({ map: tex(c), transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, toneMapped: false, fog: false, opacity: qn('haloK', 0.6) }));
  const bd = window.__bd, nrm = new THREE.Vector3(0, 0, 1).applyQuaternion(bd.quaternion), p0 = bd.position.clone().addScaledVector(nrm, 0.06);
  const d = H.clone().add(new THREE.Vector3(0, qn('haloY', 0.02), 0)).sub(camPos).normalize(); const tt = p0.clone().sub(camPos).dot(nrm) / d.dot(nrm);
  halo.position.copy(camPos).addScaledVector(d, tt); halo.quaternion.copy(bd.quaternion); scene.add(halo); }

// schwebende Lichtfunken rund um die Figur (nicht vor dem Gesicht)
{ const pc = cnv(64, 64), pg = pc.getContext('2d'); const gr = pg.createRadialGradient(32, 32, 0, 32, 32, 32); gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.25, 'rgba(255,255,255,0.7)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); pg.fillStyle = gr; pg.fillRect(0, 0, 64, 64);
  const N = 120, pos = [], col = []; const r = makeRng(23);
  while (pos.length < N * 3) { const a = r() * Math.PI * 2, rad = 0.3 + r() * 0.95, x = H.x + Math.cos(a) * rad, z = H.z + Math.sin(a) * rad * 0.9 - 0.15, y = 0.7 + r() * 1.7;
    if (z > H.z + 0.05 && Math.abs(x - H.x) < 0.45) continue; pos.push(x, y, z); const k = new THREE.Color(r() < 0.5 ? cA : cB).lerp(new THREE.Color(0xffffff), r() * 0.45); col.push(k.r, k.g, k.b); }
  const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  const pts = new THREE.Points(geo, new THREE.PointsMaterial({ size: qn('spark', 0.028), map: tex(pc), vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, toneMapped: false }));
  pts.layers.set(0); scene.add(pts); }

stage.view({ pos: camPos.toArray(), target: tgt.toArray(), fov: qn('fov', 30) }).build({ focus: H, aperture: qn('ap', 0.0011), maxblur: 0.008 });

// Aura: Silhouette der Figur als Maske rendern, weich zeichnen, als leuchtenden, leicht flackernden Rand dazurechnen (vor dem Leuchteffekt)
if (qn('aura', 1) > 0) {
  const R = stage.renderer, cam = stage.camera; const sz = R.getDrawingBufferSize(new THREE.Vector2()); const FW = sz.x, FH = sz.y;
  const rt = (w, h) => new THREE.WebGLRenderTarget(Math.round(w), Math.round(h), { type: THREE.HalfFloatType });
  const mask = rt(FW / 2, FH / 2), a1 = rt(FW / 4, FH / 4), a2 = rt(FW / 4, FH / 4), b1 = rt(FW / 12, FH / 12), b2 = rt(FW / 12, FH / 12);
  du.traverse(o => { if (o.isMesh && o.visible) o.layers.enable(5); });
  cam.updateMatrixWorld(); du.updateMatrixWorld(true);
  const prev = { bg: scene.background, ov: scene.overrideMaterial, mask: cam.layers.mask, cc: R.getClearColor(new THREE.Color()), ca: R.getClearAlpha() };
  scene.background = null; scene.overrideMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff }); cam.layers.set(5);
  R.setClearColor(0x000000, 1); R.setRenderTarget(mask); R.clear(); R.render(scene, cam);
  scene.background = prev.bg; scene.overrideMaterial = prev.ov; cam.layers.mask = prev.mask; R.setClearColor(prev.cc, prev.ca);
  const blurM = new THREE.ShaderMaterial({ uniforms: { tex: { value: null }, dir: { value: new THREE.Vector2() } },
    vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
    fragmentShader: `uniform sampler2D tex; uniform vec2 dir; varying vec2 vUv;
      void main(){ float s = 0.0, ws = 0.0; for (int i = -20; i <= 20; i++) { float w = exp(-float(i * i) / 130.0); s += texture2D(tex, vUv + dir * float(i)).r * w; ws += w; } gl_FragColor = vec4(vec3(s / ws), 1.0); }` });
  const fsq = new FullScreenQuad(blurM);
  const blur = (src, tmp, dst, px) => { blurM.uniforms.tex.value = src.texture; blurM.uniforms.dir.value.set(px / dst.width, 0); R.setRenderTarget(tmp); fsq.render(R);
    blurM.uniforms.tex.value = tmp.texture; blurM.uniforms.dir.value.set(0, px / dst.height); R.setRenderTarget(dst); fsq.render(R); };
  blur(mask, a2, a1, 1.0); blur(a1, a2, a1, 1.0); blur(a1, b2, b1, 1.0); blur(b1, b2, b1, 1.0); R.setRenderTarget(null);
  const aura = new ShaderPass({ uniforms: { tDiffuse: { value: null }, tMask: { value: null }, tA: { value: null }, tB: { value: null },
      cA: { value: new THREE.Color(cA) }, cB: { value: new THREE.Color(cB) }, kA: { value: qn('auraA', 1.1) }, kB: { value: qn('auraB', 0.7) }, flame: { value: qn('flame', 1) }, kRim: { value: qn('auraRim', 0.3) } },
    vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
    fragmentShader: `uniform sampler2D tDiffuse, tMask, tA, tB; uniform vec3 cA, cB; uniform float kA, kB, flame, kRim; varying vec2 vUv;
      float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
      float noise(vec2 p) { vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f); return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), f.x), f.y); }
      float fbm(vec2 p) { float s = 0.0, a = 0.5; for (int i = 0; i < 5; i++) { s += a * noise(p); p *= 2.07; a *= 0.5; } return s; }
      void main() { vec4 c = texture2D(tDiffuse, vUv); float m = texture2D(tMask, vUv).r;
        float n = fbm(vec2(vUv.x * 7.0, vUv.y * 3.2 - 0.7)), n2 = fbm(vec2(vUv.x * 15.0 + 3.1, vUv.y * 6.0));
        vec2 off = flame * vec2((n2 - 0.5) * 0.024, -0.042 * n);   // nach oben ziehen wie Flammen
        float a = texture2D(tA, vUv + off).r, bb = texture2D(tB, vUv + off * 2.2).r;
        float glow = kA * a * mix(1.0, 0.35 + 1.3 * n, flame) + kB * bb * bb;
        vec3 g = mix(cB, cA, smoothstep(0.08, 0.55, a)) + vec3(0.25) * smoothstep(0.6, 0.95, a);
        float rim = m * clamp(1.0 - texture2D(tA, vUv).r, 0.0, 1.0); // schmale Lichtkante innen an der Silhouette
        c.rgb += g * glow * (1.0 - m) + cA * rim * kRim;
        gl_FragColor = c; }` });
  aura.uniforms.tMask.value = mask.texture; aura.uniforms.tA.value = a1.texture; aura.uniforms.tB.value = b1.texture;
  const comp = stage.composer(); comp.insertPass(aura, comp.passes.indexOf(stage.passes.bloom) + 1);
}
stage.ready();
</script>
